name: Rust CI Core

on:
  workflow_call:
  workflow_dispatch:

jobs:
  rust_ci:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Free up disk space
      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -a -f
          sudo apt-get clean
          echo "After cleanup:"
          df -h

      # Step 3: Install essential dependencies including protobuf-compiler and dbus
      - name: Install essential dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y docker-compose jq curl lsb-release protobuf-compiler libdbus-1-dev pkg-config build-essential

      # Step 4: Install Rust toolchain
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Step 5: Make all scripts executable
      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      # Step 6: Install Rust project dependencies
      - name: Install project dependencies
        run: ./scripts/installdeps.sh

      # Step 6.5: Setup RocksDB shared storage directory
      - name: Setup RocksDB storage directory
        run: |
          mkdir -p /tmp/pullpiri_shared_rocksdb
          # Make directory writable by all users (container needs write access)
          chmod 777 /tmp/pullpiri_shared_rocksdb
          echo "✅ RocksDB storage directory created at /tmp/pullpiri_shared_rocksdb"

      # Step 5.6: Start RocksDB service container for testing
      - name: Start RocksDB service container
        run: |
          docker run -d \
            --name rocksdb-test-service \
            -p 47007:47007 \
            -v /tmp/pullpiri_shared_rocksdb:/data \
            -e RUST_LOG=info \
            ghcr.io/mco-piccolo/pullpiri-rocksdb:v11.18.0 \
            rocksdbservice --path /data --addr 0.0.0.0 --port 47007
          echo "✅ RocksDB service container started on port 47007"

      # Step 5.7: Wait for RocksDB service to be ready
      - name: Wait for RocksDB service to be ready
        run: |
          echo "⏳ Waiting for RocksDB service to be ready..."
          for i in {1..30}; do
            if docker logs rocksdb-test-service 2>&1 | grep -q "RocksDB gRPC Service starting"; then
              echo "✅ RocksDB service is ready!"
              docker logs rocksdb-test-service
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ RocksDB service failed to start!"
              docker logs rocksdb-test-service
              exit 1
            fi
            echo "  Attempt $i/30: Still waiting..."
            sleep 2
          done
          # Set environment variable for subsequent steps
          echo "ROCKSDB_SERVICE_URL=http://localhost:47007" >> $GITHUB_ENV

      # Step 6: Create output folders for reports
      - name: Create reports directory
        run: |
          mkdir -p dist/reports/fmt
          mkdir -p dist/reports/deny
          mkdir -p dist/tests
          mkdir -p dist/licenses
          mkdir -p dist/coverage
          mkdir -p dist/coverage/common
          mkdir -p dist/coverage/server
          mkdir -p dist/coverage/player
          mkdir -p dist/coverage/tools
          mkdir -p dist/coverage/agent
          mkdir -p dist/coverage/statemanager
          mkdir -p dist/coverage/actioncontroller
          mkdir -p dist/binaries

      # Step 7: Run project build and parse logs
      - name: Build and parse project
        run: ./scripts/buildNparse.sh

      # Step 7.5: Add musl target for static linking
      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl

      # Step 8: Build nodeagent binary for release (x86_64 only)
      - name: Build nodeagent binary (x86_64 static)
        run: |
          echo "Building nodeagent (static) from src/agent/nodeagent directory..."
          cd src/agent/nodeagent
          cargo build --release --target x86_64-unknown-linux-musl
          cd ../../../
          mkdir -p dist/binaries/amd/
          cp src/agent/nodeagent/target/x86_64-unknown-linux-musl/release/nodeagent dist/binaries/amd/nodeagent-linux-amd64
          ls -la dist/binaries/amd/
          file dist/binaries/amd/nodeagent-linux-amd64

      # Step 9: Upload nodeagent binary
      - name: Upload nodeagent binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodeagent-binary-amd64
          path: dist/binaries/amd/nodeagent-linux-amd64

      # Step 10: Run all Rust unit/integration tests and generate reports
      - name: Run tests and generate report
        env:
          ROCKSDB_SERVICE_URL: http://localhost:47007
        run: ./scripts/testNparse.sh

      # Step 11: Linting (clippy)
      - name: Run Clippy (lint)
        run: ./scripts/clippy_check.sh

      # Step 12: Formatting check
      - name: Run format check
        run: ./scripts/fmt_check.sh

      # Step 13: License, ban, and security checks with cargo-deny
      - name: Run cargo-deny checks
        run: ./scripts/deny_check.sh

      # Step 14: Run test coverage script
      - name: Run test coverage script
        env:
          ROCKSDB_SERVICE_URL: http://localhost:47007
        run: ./scripts/test_coverage.sh

      # Step 14.5: Cleanup RocksDB service container
      - name: Stop and remove RocksDB service
        if: always()
        run: |
          echo "🧹 Cleaning up RocksDB service..."
          docker stop rocksdb-test-service || true
          docker rm rocksdb-test-service || true
          echo "✅ RocksDB service cleaned up"

      # Step 14.6: Build safety documentation — traceability gate (ISO 26262 §7.2.11)
      # Validates all 23 req-traceability tags resolve to known comp_req__* requirement IDs.
      # A broken or missing tag fails the build, blocking any merge that breaks traceability.
      - name: Build safety documentation (traceability gate)
        run: |
          pip install --quiet sphinx sphinx-needs sphinx-rtd-theme 2>&1 | tail -3
          sphinx-build -W -b html safety_docs/docs/ safety_docs/_build/html/
          echo "✅ Sphinx traceability gate passed — all req-traceability tags resolved"

      # Step 14.7: Upload safety documentation HTML as evidence artifact
      - name: Upload safety documentation (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-docs-html
          path: safety_docs/_build/html/

      # === Upload All Reports ===

      # Step 15: Upload deny report
      - name: Upload deny report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deny-report
          path: dist/reports/deny/deny_summary.md

      # Step 16: Upload format report
      - name: Upload fmt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmt-report
          path: dist/reports/fmt/fmt_summary.md

      # Step 16-2: Upload clippy report
      - name: Upload clippy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-report
          path: dist/reports/clippy/clippy_summary.md

      # Step 17: Upload all test reports (JUnit-style)
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: dist/tests/*

      # Step 18: Upload test coverage reports
      - name: Upload Overall coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: dist/coverage/*

      - name: Upload coverage report for server (lcov)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-lcov-server
          path: dist/coverage/server/lcov.info

      - name: Upload coverage report for server (xml)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-xml-server
          path: dist/coverage/server/cobertura.xml

      - name: Upload coverage report for server (html)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-html-server
          path: dist/coverage/server/tarpaulin-report-server.html

      - name: Upload coverage report for tools (lcov)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-lcov-tools
          path: dist/coverage/tools/lcov.info

      - name: Upload coverage report for tools (xml)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-xml-tools
          path: dist/coverage/tools/cobertura.xml

      - name: Upload coverage report for tools (html)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-html-tools
          path: dist/coverage/tools/tarpaulin-report-tools.html

      - name: Upload coverage report for common (lcov)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-lcov-common
          path: dist/coverage/common/lcov.info

      - name: Upload coverage report for common (xml)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-xml-common
          path: dist/coverage/common/cobertura.xml

      - name: Upload coverage report for common (html)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-html-common
          path: dist/coverage/common/tarpaulin-report-common.html

      # Agent (NodeAgent) coverage — re-enabled after test fixes (ISO 26262 §9.4.5)
      - name: Upload coverage report for agent (lcov)
        if: always() && hashFiles('dist/coverage/agent/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-lcov-agent
          path: dist/coverage/agent/lcov.info

      - name: Upload coverage report for agent (xml)
        if: always() && hashFiles('dist/coverage/agent/cobertura.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-xml-agent
          path: dist/coverage/agent/cobertura.xml

      - name: Upload coverage report for agent (html)
        if: always() && hashFiles('dist/coverage/agent/tarpaulin-report-agent.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-html-agent
          path: dist/coverage/agent/tarpaulin-report-agent.html

      # StateManager coverage — new addition (ISO 26262 §9.4.5)
      - name: Upload coverage report for statemanager (lcov)
        if: always() && hashFiles('dist/coverage/statemanager/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-lcov-statemanager
          path: dist/coverage/statemanager/lcov.info

      - name: Upload coverage report for statemanager (xml)
        if: always() && hashFiles('dist/coverage/statemanager/cobertura.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-xml-statemanager
          path: dist/coverage/statemanager/cobertura.xml

      - name: Upload coverage report for statemanager (html)
        if: always() && hashFiles('dist/coverage/statemanager/tarpaulin-report-statemanager.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-html-statemanager
          path: dist/coverage/statemanager/tarpaulin-report-statemanager.html

      # ActionController coverage — new addition (ISO 26262 §9.4.5)
      - name: Upload coverage report for actioncontroller (lcov)
        if: always() && hashFiles('dist/coverage/actioncontroller/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-lcov-actioncontroller
          path: dist/coverage/actioncontroller/lcov.info

      - name: Upload coverage report for actioncontroller (xml)
        if: always() && hashFiles('dist/coverage/actioncontroller/cobertura.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-xml-actioncontroller
          path: dist/coverage/actioncontroller/cobertura.xml

      - name: Upload coverage report for actioncontroller (html)
        if: always() && hashFiles('dist/coverage/actioncontroller/tarpaulin-report-actioncontroller.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-html-actioncontroller
          path: dist/coverage/actioncontroller/tarpaulin-report-actioncontroller.html

      - name: Upload coverage report for player (lcov)
        if: always() && hashFiles('dist/coverage/player/lcov.info') != ''
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-lcov-player
          path: dist/coverage/player/lcov.info

      - name: Upload coverage report for player (xml)
        if: always() && hashFiles('dist/coverage/player/cobertura.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-xml-player
          path: dist/coverage/player/cobertura.xml
    
      - name: Upload coverage report for player (html)
        if: always() && hashFiles('dist/coverage/player/tarpaulin-report-player.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-html-player
          path: dist/coverage/player/tarpaulin-report-player.html
    
      # # Step 17: Upload to Codecov
      # - name: Upload to Codecov
      #   if: env.CODECOV_TOKEN != ''
      #   uses: codecov/codecov-action@v4.0.1
      #   with:
      #     token: ${{ env.CODECOV_TOKEN }}
      #     slug: ${{ github.repository }}
      #     files: dist/coverage/lcov.info

  build_linux_arm64:
    runs-on: ubuntu-22.04-arm
    steps:
      # Step 1: Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install essential dependencies including protobuf-compiler and dbus
      - name: Install essential dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y docker-compose jq curl lsb-release protobuf-compiler libdbus-1-dev pkg-config build-essential

      # Step 3: Install Rust toolchain
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Step 4: Add musl target for static linking
      - name: Add musl target
        run: rustup target add aarch64-unknown-linux-musl

      # Step 5: Build nodeagent binary for ARM64 release
      - name: Build nodeagent binary (ARM64 static)
        run: |
          echo "Building nodeagent (static) from src/agent/nodeagent directory for ARM64..."
          cd src/agent/nodeagent
          cargo build --release --target aarch64-unknown-linux-musl
          cd ../../../
          mkdir -p dist/binaries/arm/
          cp src/agent/nodeagent/target/aarch64-unknown-linux-musl/release/nodeagent dist/binaries/arm/nodeagent-linux-arm64
          ls -la dist/binaries/arm/
          file dist/binaries/arm/nodeagent-linux-arm64
      # Step 6: Upload ARM64 nodeagent binary
      - name: Upload nodeagent binary (ARM64)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodeagent-binary-arm64
          path: dist/binaries/arm/nodeagent-linux-arm64

  # ===========================================================================
  # ThreadSanitizer (TSan) Job — ISO 26262 §9.4.9 Dynamic Analysis Evidence
  # Runs on nightly Rust toolchain to detect data races in async concurrent
  # code across StateManager, ActionController, and NodeAgent.
  # Run: cargo +nightly test with -Z sanitizer=thread
  # Output: dist/reports/tsan_report.txt — uploaded as CI evidence artifact.
  # ===========================================================================
  tsan_sanitizer:
    runs-on: ubuntu-latest
    name: ThreadSanitizer (TSan) — Concurrency Safety Check
    continue-on-error: true  # non-blocking until TSan is stable on all crates

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install essential dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y protobuf-compiler libdbus-1-dev pkg-config build-essential

      - name: Install Rust nightly toolchain with TSan components
        run: |
          rustup toolchain install nightly --component rust-src
          rustup override set nightly

      - name: Create TSan report directory
        run: mkdir -p dist/reports

      # Run TSan on the workspace (excludes nodeagent which has a separate manifest)
      - name: Run ThreadSanitizer on workspace crates
        run: |
          echo "🔍 Running ThreadSanitizer (TSan) — ISO 26262 §9.4.9" | tee dist/reports/tsan_report.txt
          echo "Target: StateManager, ActionController, FilterGateway, APIServer" | tee -a dist/reports/tsan_report.txt
          echo "Toolchain: $(rustc --version)" | tee -a dist/reports/tsan_report.txt
          echo "Date: $(date -u)" | tee -a dist/reports/tsan_report.txt
          echo "====================================================" | tee -a dist/reports/tsan_report.txt
          RUSTFLAGS="-Z sanitizer=thread" \
          cargo +nightly test --workspace \
            -Z build-std \
            --target x86_64-unknown-linux-gnu \
            2>&1 | tee -a dist/reports/tsan_report.txt || true
          echo "====================================================" | tee -a dist/reports/tsan_report.txt
          # Report TSan races as warnings; full gate will be enabled after baseline is clean
          if grep -q "ThreadSanitizer: data race" dist/reports/tsan_report.txt; then
            echo "::warning ::TSan detected data race(s). Review dist/reports/tsan_report.txt" | tee -a dist/reports/tsan_report.txt
          else
            echo "✅ No TSan data races detected" | tee -a dist/reports/tsan_report.txt
          fi

      # Run TSan on nodeagent separately (separate Cargo workspace)
      - name: Run ThreadSanitizer on NodeAgent
        run: |
          echo "" >> dist/reports/tsan_report.txt
          echo "=== NodeAgent TSan Run ==========================" >> dist/reports/tsan_report.txt
          RUSTFLAGS="-Z sanitizer=thread" \
          cargo +nightly test \
            --manifest-path src/agent/nodeagent/Cargo.toml \
            -Z build-std \
            --target x86_64-unknown-linux-gnu \
            2>&1 | tee -a dist/reports/tsan_report.txt || true

      - name: Upload TSan report as evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-sanitizer-report
          path: dist/reports/tsan_report.txt

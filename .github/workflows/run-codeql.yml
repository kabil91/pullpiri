name: CodeQL Security Scan (ISO 26262 §9.4.9 Static Analysis)
# Runs CodeQL static analysis on all safety-critical Pullpiri Rust source files.
# Output: SARIF report uploaded to GitHub Security tab and as CI evidence artifact.
# ISO 26262 Part 6 §9.4.9 — Static analysis is a recommended method for ASIL-B.
#
# NOTE: CodeQL supports Rust via the 'rust' language extractor (GA since 2024).
# This workflow uses autobuild to capture the Rust build for analysis.

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  codeql_scan:
    name: CodeQL Static Analysis (Rust)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write  # Required to upload SARIF results

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install build dependencies for Rust code
      - name: Install essential dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y protobuf-compiler libdbus-1-dev pkg-config build-essential

      # Step 3: Install stable Rust toolchain (pinned via rust-toolchain.toml)
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Step 4: Initialize CodeQL with Rust language support
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: rust

      # Step 5: Build the workspace so CodeQL can capture build artifacts
      - name: Build workspace for CodeQL capture
        run: |
          cargo build --workspace 2>&1 | tail -20

      # Step 6: Perform CodeQL analysis and upload SARIF to Security tab
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:rust"

      # Step 7: Generate static analysis summary for evidence package
      - name: Generate CodeQL evidence summary
        if: always()
        run: |
          mkdir -p dist/reports
          echo "# CodeQL Static Analysis Report" > dist/reports/codeql_summary.md
          echo "" >> dist/reports/codeql_summary.md
          echo "**ISO 26262 Clause:** Part 6 §9.4.9 (Static analysis)" >> dist/reports/codeql_summary.md
          echo "**Scan Date:** $(date -u)" >> dist/reports/codeql_summary.md
          echo "**Toolchain:** $(rustc --version)" >> dist/reports/codeql_summary.md
          echo "**Language:** Rust (CodeQL native extractor)" >> dist/reports/codeql_summary.md
          echo "**Scope:** All Pullpiri Rust workspace crates" >> dist/reports/codeql_summary.md
          echo "" >> dist/reports/codeql_summary.md
          echo "## Modules Scanned" >> dist/reports/codeql_summary.md
          echo "- src/server/apiserver/ (comp_req__api__*)" >> dist/reports/codeql_summary.md
          echo "- src/player/statemanager/ (comp_req__sm__*)" >> dist/reports/codeql_summary.md
          echo "- src/player/actioncontroller/ (comp_req__ac__*)" >> dist/reports/codeql_summary.md
          echo "- src/player/filtergateway/ (comp_req__fg__*)" >> dist/reports/codeql_summary.md
          echo "- src/agent/nodeagent/ (comp_req__na__*)" >> dist/reports/codeql_summary.md
          echo "" >> dist/reports/codeql_summary.md
          echo "## Result" >> dist/reports/codeql_summary.md
          echo "SARIF results uploaded to GitHub Security tab. View at:" >> dist/reports/codeql_summary.md
          echo "https://github.com/kabil91/pullpiri/security/code-scanning" >> dist/reports/codeql_summary.md
          cat dist/reports/codeql_summary.md

      # Step 8: Upload CodeQL summary as evidence artifact
      - name: Upload CodeQL evidence summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-static-analysis-report
          path: dist/reports/codeql_summary.md
